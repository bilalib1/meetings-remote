<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07112f"/>
      <stop offset="1" stop-color="#121b48"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#80e1cb"/>
    </marker>
    <style>
      .title { font: 700 40px system-ui, sans-serif; fill: #fff; }
      .subtitle { font: 400 21px system-ui, sans-serif; fill: #bcc7ee; }
      .head { font: 700 25px system-ui, sans-serif; fill: #fff; }
      .body { font: 400 19px system-ui, sans-serif; fill: #e5e9fa; }
      .note { font: 600 18px system-ui, sans-serif; fill: #ff9b89; }
      .box { fill: #182457; stroke: #6f79d8; stroke-width: 3; rx: 24; }
      .store { fill: #183f4c; stroke: #80e1cb; stroke-width: 3; rx: 24; }
      .zoom { fill: #3d234d; stroke: #ff806e; stroke-width: 3; rx: 24; }
      .arrow { fill: none; stroke: #80e1cb; stroke-width: 4; marker-end: url(#arrow); }
      .media { fill: none; stroke: #ff806e; stroke-width: 5; marker-end: url(#arrow); }
      .label { font: 600 17px system-ui, sans-serif; fill: #80e1cb; }
      .mediaLabel { font: 600 17px system-ui, sans-serif; fill: #ff9b89; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="78" class="title">Mobile Remote — production architecture and data flow</text>
  <text x="80" y="116" class="subtitle">Android Meeting SDK client + user-managed OAuth broker. No meeting media crosses the backend.</text>

  <rect x="80" y="200" width="420" height="400" class="box"/>
  <text x="115" y="250" class="head">Android tablet app</text>
  <text x="115" y="298" class="body">• Kotlin / Android 16 (target API 36)</text>
  <text x="115" y="334" class="body">• Chrome Custom Tab for Zoom sign-in</text>
  <text x="115" y="370" class="body">• Opaque revocable session ID only</text>
  <text x="115" y="406" class="body">• Zoom Meeting SDK 7.x</text>
  <text x="115" y="442" class="body">• RTSP external camera / test pattern</text>
  <text x="115" y="478" class="body">• On-device AV synchronization</text>
  <text x="115" y="534" class="note">No OAuth refresh/access token stored here</text>

  <rect x="650" y="175" width="420" height="270" class="store"/>
  <text x="685" y="225" class="head">Cloudflare Worker API</text>
  <text x="685" y="273" class="body">• OAuth Authorization Code + PKCE</text>
  <text x="685" y="309" class="body">• SDK JWT signing</text>
  <text x="685" y="345" class="body">• Session / refresh / sign-out APIs</text>
  <text x="685" y="381" class="body">• Deauthorization + deletion handling</text>
  <text x="685" y="417" class="body">• Rate limiting and HTTPS only</text>

  <rect x="650" y="535" width="420" height="225" class="store"/>
  <text x="685" y="585" class="head">Cloudflare D1 + Worker secrets</text>
  <text x="685" y="633" class="body">• Refresh token, user ID, name, PMI, ZAK</text>
  <text x="685" y="669" class="body">• AES-256-GCM envelope encryption at rest</text>
  <text x="685" y="705" class="body">• Encryption and app keys stored as secrets</text>
  <text x="685" y="741" class="body">• Rows deleted on sign-out/deauthorization</text>

  <rect x="1215" y="200" width="305" height="400" class="zoom"/>
  <text x="1250" y="250" class="head">Zoom services</text>
  <text x="1250" y="305" class="body">OAuth authorize/token/revoke</text>
  <text x="1250" y="356" class="body">REST API:</text>
  <text x="1270" y="390" class="body">• user profile + PMI</text>
  <text x="1270" y="424" class="body">• ZAK</text>
  <text x="1270" y="458" class="body">• meeting status</text>
  <text x="1250" y="515" class="body">Meeting SDK media service</text>
  <text x="1250" y="559" class="note">Zoom credentials never enter the APK</text>

  <path d="M500 300 C555 300 585 285 650 285" class="arrow"/>
  <text x="520" y="278" class="label">HTTPS API + sid</text>
  <path d="M650 375 C590 375 560 410 500 410" class="arrow"/>
  <text x="518" y="402" class="label">name / PMI / ZAK</text>
  <path d="M860 445 L860 535" class="arrow"/>
  <text x="880" y="498" class="label">encrypted session fields</text>
  <path d="M1070 290 C1130 290 1155 285 1215 285" class="arrow"/>
  <text x="1083" y="265" class="label">OAuth + REST</text>
  <path d="M500 520 C760 835 1110 760 1215 530" class="media"/>
  <text x="590" y="825" class="mediaLabel">Direct encrypted meeting media: tablet ↔ Zoom (never Worker/D1)</text>

  <text x="80" y="866" class="subtitle">Scopes: user:read:user · user:read:zak · meeting:update:status</text>
</svg>
